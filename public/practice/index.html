<!doctype html><html lang="ru"><meta charset="utf-8"><title>Regola Store — демонстрация заказа</title><style>body{margin:32px;background:#f2f3f5;font:16px Arial}main{max-width:1150px;margin:auto}pre{min-height:460px;background:#141a23;color:#eef1f5;padding:24px;white-space:pre-wrap;font:16px/1.5 Consolas,monospace}button{padding:12px 20px;font-size:16px;cursor:pointer}</style><main><h1>Regola Store — сохранение заказа в SQLite</h1><p>Работа настоящего server/checkout.js в отдельной базе в памяти. Боевые заказы, платежи и доставка не создаются.</p><button onclick="play()">Воспроизвести запись</button><pre id="terminal"></pre></main><script>const events=[[0.046, "o", "REGOLA STORE | Демонстрация сохранения заказа в учебной SQLite\r\n"], [0.046, "o", "Используется настоящий модуль server/checkout.js; внешние API не вызываются.\r\n"], [1.859, "o", "\r\n"], [1.859, "o", "1. В базе создан учебный товар: id=1, цена=2490 рублей.\r\n"], [1.859, "o", "Количество заказов до оформления: 0\r\n"], [3.671, "o", "\r\n"], [3.671, "o", "2. Покупатель выбирает 2 товара. В запросе намеренно подставлены price=1 и total=2.\r\n"], [5.5, "o", "\r\n"], [5.5, "o", "3. Сервер читает цену из SQLite, рассчитывает сумму и сохраняет заказ транзакцией.\r\n"], [5.5, "o", "Заказ: {\"orderId\":1,\"goodsTotal\":4980,\"deliveryPrice\":310,\"total\":5290}\r\n"], [5.5, "o", "Заказов после оформления: 1\r\n"], [5.5, "o", "Сохраненные позиции: [{\"product_id\":1,\"qty\":2,\"price\":2490}]\r\n"], [7.296, "o", "\r\n"], [7.296, "o", "4. Попытка оформить заказ с отрицательным количеством.\r\n"], [7.296, "o", "Сервер отклонил запрос: Количество товара должно быть целым числом от 1 до 99\r\n"], [7.296, "o", "Количество заказов осталось 1. Проверки пройдены.\r\n"], [7.296, "o", "Оплата и отправление СДЭК в этой демонстрации не создаются.\r\n"]];let pending=[];function play(){pending.forEach(clearTimeout);pending=[];terminal.textContent='';for(const [t,type,text] of events)pending.push(setTimeout(()=>terminal.textContent+=text,t*1000));}play();</script></html>
